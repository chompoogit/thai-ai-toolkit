<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thai AI Toolkit</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f0f7ff;
      color: #222;
    }
    h1 { color: #155eef; }
    textarea {
      width: 100%;
      height: 180px;
      padding: 12px;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 8px;
    }
    button {
      background: #155eef;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 12px;
    }
    #result {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>🇹🇭 Thai AI Toolkit</h1>
  <p>เครื่องมือช่วยสรุปข้อความภาษาไทย</p>

  <textarea id="input" placeholder="วางข้อความที่ต้องการสรุปที่นี่..."></textarea>
  <br>
  <button onclick="summarize()">สรุปข้อความ</button>

  <div id="result">ผลสรุปจะแสดงที่นี่</div>

  <script>
    function summarize() {
      const text = document.getElementById("input").value.trim();
      const result = document.getElementById("result");

      if (!text) {
        result.textContent = "กรุณาใส่ข้อความก่อนนะ 😊";
        return;
      }

      const sentences = text.match(/[^.!?。]+[.!?。]?/g) || [text];
      const count = Math.max(1, Math.ceil(sentences.length / 2));
      result.textContent = sentences.slice(0, count).join("").trim();
    }
  </script>
</body>
</html>
